name: Refresh Sermons & Deploy

on:
  push:
    branches:
      - main
  schedule:
    - cron: '15 16 * * 0' # Every Sunday at 9:15 AM MST (16:15 UTC) - refreshes upcoming service
    - cron: '15 16 * * 1' # Every Monday at 9:15 AM MST (16:15 UTC) - pulls the newest Sunday sermon
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies & Playwright Browser
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Fetch Latest 5 YouTube Sermons
        run: node scripts/fetch-sermons.mjs

      - name: Fetch Events from Planning Center
        run: node scripts/fetch-events.mjs
        env:
          PCO_CLIENT_ID: ${{ secrets.PCO_CLIENT_ID }}
          PCO_SECRET: ${{ secrets.PCO_SECRET }}
          PCO_GROUP_WHITELIST: ${{ vars.PCO_GROUP_WHITELIST }}
          PCO_CALENDAR_TAG: ${{ vars.PCO_CALENDAR_TAG }}

      - name: Commit refreshed sermons.html & events.html
        id: commit
        run: |
          if ! git diff --quiet -- sermons.html events.html; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add sermons.html events.html
            git commit -m "chore(ci): refresh sermons.html and events.html with latest content"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Push refresh
        if: steps.commit.outputs.changed == 'true'
        run: |
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
