name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  schedule:
    - cron: '15 16 * * 0' # Every Sunday at 9:15 AM MST (16:15 UTC) - refreshes upcoming service
    - cron: '15 16 * * 1' # Every Monday at 9:15 AM MST (16:15 UTC) - pulls the newest Sunday sermon
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies & Playwright Browser
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Fetch Latest 5 YouTube Sermons
        run: |
          node scripts/fetch-sermons.mjs

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Inject GitHub Secrets into JS Configuration
        run: |
          if [ -n "${{ secrets.FORM_RECIPIENT_EMAIL }}" ]; then
            echo "Injecting secret email into js/config.js"
            sed -i 's|"office@journeyofgrace.church"|"${{ secrets.FORM_RECIPIENT_EMAIL }}"|g' js/config.js
          fi
          if [ -n "${{ secrets.PCO_CLIENT_ID }}" ]; then
            echo "Injecting PCO_CLIENT_ID into js/config.js"
            sed -i 's|planningCenter.clientId = ""|planningCenter.clientId = "${{ secrets.PCO_CLIENT_ID }}"|g' js/config.js
          fi
          if [ -n "${{ secrets.PCO_WORKER_URL }}" ]; then
            echo "Injecting PCO_WORKER_URL into js/config.js"
            sed -i 's|planningCenter.workerUrl = ""|planningCenter.workerUrl = "${{ secrets.PCO_WORKER_URL }}"|g' js/config.js
          fi

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
