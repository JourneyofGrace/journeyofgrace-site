name: PCO Form Fields Probe
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run API probe
        run: node scripts/pco-formfields.mjs
        env:
          PCO_CLIENT_ID: ${{ secrets.PCO_CLIENT_ID }}
          PCO_SECRET: ${{ secrets.PCO_SECRET }}
