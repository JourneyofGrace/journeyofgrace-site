services:
  web:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: journeyofgrace-site
    ports:
      - "80:80"
      - "443:443"
    # Let's Encrypt HTTP-01 challenges: certbot writes tokens into
    # webroot/.well-known/acme-challenge on the host (see scripts/tls-renew.sh),
    # and nginx serves /.well-known/acme-challenge/ from here.
    volumes:
      - ./webroot/.well-known:/usr/share/nginx/html/.well-known:ro
      # Real Let's Encrypt certs issued on the host (see docs/TLS.md) replace
      # the baked-in self-signed placeholder at /etc/nginx/tls.
      - /etc/letsencrypt/live/test.journeyofgrace.church:/etc/nginx/tls:ro
    restart: unless-stopped
    healthcheck:
      # nginx listens IPv4-only, and localhost resolves to ::1 inside the
      # container, so the probe must use the literal IPv4 loopback.
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

  # Planning Center form-submission relay (sidecar).
  # Holds the PCO Personal Access Token as a server-side secret (api/.env,
  # gitignored) and forwards form submissions to the People API. Static site
  # JS never sees the token. See api/relay.mjs and docs/planning-center.md.
  api:
    image: node:20-alpine
    container_name: journeyofgrace-relay
    working_dir: /app
    volumes:
      - ./api:/app
    command: ["node", "relay.mjs"]
    env_file:
      - api/.env
    ports:
      - "3001:3000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
