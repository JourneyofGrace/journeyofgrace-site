services:
  web:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: journeyofgrace-site
    ports:
      - "8080:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost/journeyofgrace-site/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

  # Planning Center form-submission relay (sidecar).
  # Holds the PCO Personal Access Token as a server-side secret (api/.env,
  # gitignored) and forwards form submissions to the People API. Static site
  # JS never sees the token. See api/relay.mjs and docs/planning-center.md.
  api:
    image: node:20-alpine
    container_name: journeyofgrace-relay
    working_dir: /app
    volumes:
      - ./api:/app
    command: ["node", "relay.mjs"]
    env_file:
      - api/.env
    ports:
      - "3001:3000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
