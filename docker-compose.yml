services:
  web:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: journeyofgrace-site
    ports:
      - "8080:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost/journeyofgrace-site/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
