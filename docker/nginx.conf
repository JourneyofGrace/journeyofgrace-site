# Journey of Grace — nginx config.
#
# Serves the static site at the root "/" and maps extensionless page links
# (about-us) to their .html file, mirroring GitHub Pages clean-URL behaviour.
#
# TLS: :443 serves with a self-signed placeholder cert baked into the image so
# the container runs anywhere with TLS enabled out of the box. To use a real
# Let's Encrypt cert, mount the host certdir over /etc/nginx/tls and load the
# container (see docs/TLS.md + docker-compose.yml override):
#   - /etc/letsencrypt/live/<domain>:/etc/nginx/tls:ro
# DOMAIN is swapped in at build time via the Dockerfile ARG (default: the
# site hostname). DNS must point at the host before requesting certs.

server {
    listen       80;
    server_name  _;

    # ACME challenge for Let's Encrypt (kept on plain HTTP so the CA can validate).
    location /.well-known/acme-challenge/ {
        root /usr/share/nginx/html;
    }

    # Once real certs are active, uncomment to redirect everything else to https:
    # return 301 https://$host$request_uri;

    root   /usr/share/nginx/html;
    index  index.html;

    # Keep redirects relative so the port survives when not running on :80.
    absolute_redirect off;

    # Form-submission relay (docker-compose service "api"): the browser talks
    # to the same origin, nginx forwards /api/* to the relay container.
    location /api/ {
        proxy_pass http://journeyofgrace-relay:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri.html $uri/index.html =404;
    }

    error_page 404 /404.html;
}

# HTTPS server block. Uses the in-image placeholder cert (self-signed) by
# default; mount real Let's Encrypt certs over /etc/nginx/tls to serve the
# actual certificate chain.
server {
    listen       443 ssl;
    http2        on;
    server_name  _;

    ssl_certificate     /etc/nginx/tls/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;

    root   /usr/share/nginx/html;
    index  index.html;
    absolute_redirect off;

    location /api/ {
        proxy_pass http://journeyofgrace-relay:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri.html $uri/index.html =404;
    }

    error_page 404 /404.html;
}
