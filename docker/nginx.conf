# Journey of Grace — nginx config.
#
# Serves the static site at the root "/" and maps extensionless page links
# (about-us) to their .html file, mirroring GitHub Pages clean-URL behaviour.
#
# TLS: :443 serves the Let's Encrypt cert for test.journeyofgrace.church from
# /etc/letsencrypt/live/<domain> (the Dockerfile bakes a self-signed placeholder
# at that path so the container runs anywhere; on the server the whole
# /etc/letsencrypt dir is mounted read-only — see docs/TLS.md — because the
# live/*.pem files are symlinks into archive/).
# Port 80 serves only the ACME challenge and redirects everything else to https.

server {
    listen       80;
    server_name  _;

    # ACME challenge for Let's Encrypt (kept on plain HTTP so the CA can validate).
    location /.well-known/acme-challenge/ {
        root /usr/share/nginx/html;
    }

    # Redirect everything except ACME challenges to https (the return lives in
    # location / because a server-level return fires before location matching).

    root   /usr/share/nginx/html;
    index  index.html;

    # Keep redirects relative so the port survives when not running on :80.
    absolute_redirect off;

    # Form-submission relay (docker-compose service "api"): the browser talks
    # to the same origin, nginx forwards /api/* to the relay container.
    location /api/ {
        proxy_pass http://journeyofgrace-relay:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        return 301 https://$host$request_uri;
    }

    error_page 404 /404.html;
}

# HTTPS server block. Uses the in-image placeholder cert (self-signed) by
# default; with /etc/letsencrypt mounted (see docs/TLS.md) it serves the real
# Let's Encrypt chain for test.journeyofgrace.church. Note: live/*.pem are
# symlinks into archive/, so the mount must include the whole /etc/letsencrypt
# directory for nginx to resolve them.
server {
    listen       443 ssl;
    http2        on;
    server_name  _;

    ssl_certificate     /etc/letsencrypt/live/test.journeyofgrace.church/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/test.journeyofgrace.church/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;

    root   /usr/share/nginx/html;
    index  index.html;
    absolute_redirect off;

    location /api/ {
        proxy_pass http://journeyofgrace-relay:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri.html $uri/index.html =404;
    }

    error_page 404 /404.html;
}
