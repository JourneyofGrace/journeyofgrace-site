server {
    listen       80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # Keep redirects relative so the port survives when not running on :80
    absolute_redirect off;

    # The site is served under the same base path used by GitHub Pages so the
    # absolute nav links (/journeyofgrace-site/about-us, etc.) and relative
    # asset links (css/…, assets/…) all resolve without rewriting the markup.
    location /journeyofgrace-site/ {
        # Map extensionless page links (about-us) to their .html file, mirroring
        # GitHub Pages clean-URL behaviour. Direct .html links still work.
        try_files $uri $uri.html $uri/index.html =404;
    }

    # Everything else (optional convenience: root redirects to the site homepage)
    location = / {
        return 302 /journeyofgrace-site/;
    }

    error_page 404 /journeyofgrace-site/404.html;
}
